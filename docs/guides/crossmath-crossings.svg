<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>One crossing number completes two equations</title><desc>CrossMath · shared-cell example</desc><rect width="720" height="400" rx="20" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="36" font-size="23" fill="#283249" font-weight="700" text-anchor="start">One crossing number completes two equations</text><text x="28" y="62" font-size="16" fill="#536078" font-weight="400" text-anchor="start">CrossMath · shared-cell example</text><rect x="28" y="90" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="52.0" y="122.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">3</text><rect x="81" y="90" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="105.0" y="122.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">+</text><rect x="134" y="90" width="48" height="48" rx="7" fill="#fff0df" stroke="#a94f16" stroke-width="2"/><text x="158.0" y="122.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">?</text><rect x="187" y="90" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="211.0" y="122.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">=</text><rect x="240" y="90" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="264.0" y="122.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">8</text><rect x="134" y="143" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="158.0" y="175.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">+</text><rect x="134" y="196" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="158.0" y="228.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">4</text><rect x="134" y="249" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="158.0" y="281.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">=</text><rect x="134" y="302" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="158.0" y="334.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">9</text><text x="340" y="127" font-size="19" fill="#283249" font-weight="400" text-anchor="start">Across: 3 + 5 = 8.</text><text x="340" y="156" font-size="19" fill="#283249" font-weight="400" text-anchor="start">Down: 5 + 4 = 9.</text><text x="340" y="185" font-size="19" fill="#283249" font-weight="400" text-anchor="start">The shared blank is 5.</text><rect x="340" y="239" width="348" height="100" rx="10" fill="#fff0df" stroke="#e8c7a7" stroke-width="2"/><text x="357" y="276" font-size="18" fill="#283249" font-weight="400" text-anchor="start">Read each equation as</text><text x="357" y="305" font-size="18" fill="#283249" font-weight="400" text-anchor="start">number, operator, number, =, result.</text></g></svg>
