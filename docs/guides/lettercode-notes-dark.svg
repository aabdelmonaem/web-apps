<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>Color notes are your own deductions</title><desc>LetterCode · tap a submitted letter to cycle its note</desc><rect width="720" height="400" rx="20" fill="#1b2133"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="36" font-size="23" fill="#edf0fa" font-weight="700" text-anchor="start">Color notes are your own deductions</text><text x="28" y="62" font-size="16" fill="#a4aec7" font-weight="400" text-anchor="start">LetterCode · tap a submitted letter to cycle its note</text><rect x="40" y="128" width="80" height="80" rx="7" fill="#252d42" stroke="#edf0fa" stroke-width="2"/><text x="80.0" y="176.0" font-size="24" fill="#edf0fa" font-weight="700" text-anchor="middle">A</text><text x="80" y="250" font-size="18" fill="#edf0fa" font-weight="700" text-anchor="middle">No note</text><text x="156" y="181" font-size="30" fill="#a4aec7" font-weight="400" text-anchor="start">→</text><rect x="213" y="128" width="80" height="80" rx="7" fill="#432630" stroke="#ff9ca9" stroke-width="2"/><text x="253.0" y="176.0" font-size="24" fill="#edf0fa" font-weight="700" text-anchor="middle">A</text><text x="253" y="250" font-size="18" fill="#ff9ca9" font-weight="700" text-anchor="middle">Red note</text><text x="329" y="181" font-size="30" fill="#a4aec7" font-weight="400" text-anchor="start">→</text><rect x="386" y="128" width="80" height="80" rx="7" fill="#41391f" stroke="#f2d579" stroke-width="2"/><text x="426.0" y="176.0" font-size="24" fill="#edf0fa" font-weight="700" text-anchor="middle">A</text><text x="426" y="250" font-size="18" fill="#f2d579" font-weight="700" text-anchor="middle">Yellow note</text><text x="502" y="181" font-size="30" fill="#a4aec7" font-weight="400" text-anchor="start">→</text><rect x="559" y="128" width="80" height="80" rx="7" fill="#203b33" stroke="#8cdbba" stroke-width="2"/><text x="599.0" y="176.0" font-size="24" fill="#edf0fa" font-weight="700" text-anchor="middle">A</text><text x="599" y="250" font-size="18" fill="#8cdbba" font-weight="700" text-anchor="middle">Green note</text><text x="40" y="316" font-size="18" fill="#edf0fa" font-weight="400" text-anchor="start">The next tap after green removes the note.</text><text x="40" y="345" font-size="18" fill="#edf0fa" font-weight="400" text-anchor="start">Clear color notes removes your marks, while keeping guesses and totals.</text></g></svg>
