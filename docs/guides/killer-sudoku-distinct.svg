<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>A repeated digit cannot solve a cage</title><desc>Killer Sudoku · two cells totaling 4</desc><rect width="720" height="400" rx="20" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="36" font-size="23" fill="#283249" font-weight="700" text-anchor="start">A repeated digit cannot solve a cage</text><text x="28" y="62" font-size="16" fill="#536078" font-weight="400" text-anchor="start">Killer Sudoku · two cells totaling 4</text><rect x="40" y="126" width="104" height="104" rx="7" fill="#e7f3ed" stroke="#17624c" stroke-width="2"/><text x="92.0" y="186.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">1</text><rect x="156" y="126" width="104" height="104" rx="7" fill="#e7f3ed" stroke="#17624c" stroke-width="2"/><text x="208.0" y="186.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">3</text><rect x="45" y="131" width="210" height="94" rx="5" fill="none" stroke="#17624c" stroke-width="2" stroke-dasharray="6 4"/><text x="54" y="153" font-size="17" fill="#17624c" font-weight="700" text-anchor="start">4</text><text x="40" y="275" font-size="19" fill="#17624c" font-weight="700" text-anchor="start">Valid combination</text><rect x="390" y="126" width="104" height="104" rx="7" fill="#fff0f1" stroke="#ac3445" stroke-width="2"/><text x="442.0" y="186.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">2</text><rect x="506" y="126" width="104" height="104" rx="7" fill="#fff0f1" stroke="#ac3445" stroke-width="2"/><text x="558.0" y="186.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">2</text><rect x="395" y="131" width="210" height="94" rx="5" fill="none" stroke="#ac3445" stroke-width="2" stroke-dasharray="6 4"/><text x="404" y="153" font-size="17" fill="#ac3445" font-weight="700" text-anchor="start">4</text><text x="390" y="275" font-size="19" fill="#ac3445" font-weight="700" text-anchor="start">Not allowed: repeated digit</text><text x="40" y="330" font-size="18" fill="#283249" font-weight="400" text-anchor="start">1 + 3 and 2 + 2 both add to 4, but only 1 + 3 uses different digits.</text><text x="40" y="359" font-size="18" fill="#283249" font-weight="400" text-anchor="start">Use Sudoku clues to decide which cell gets 1 and which gets 3.</text></g></svg>
