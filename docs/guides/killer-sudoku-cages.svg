<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>A cage total is shared by its cells</title><desc>Killer Sudoku · cage example</desc><rect width="720" height="400" rx="20" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="36" font-size="23" fill="#283249" font-weight="700" text-anchor="start">A cage total is shared by its cells</text><text x="28" y="62" font-size="16" fill="#536078" font-weight="400" text-anchor="start">Killer Sudoku · cage example</text><rect x="44" y="115" width="120" height="140" rx="0" fill="#fff0df" stroke="#c6cfdd" stroke-width="2"/><text x="104" y="205" font-size="42" fill="#283249" font-weight="700" text-anchor="middle">1</text><rect x="164" y="115" width="120" height="140" rx="0" fill="#fff0df" stroke="#c6cfdd" stroke-width="2"/><text x="224" y="205" font-size="42" fill="#283249" font-weight="700" text-anchor="middle">9</text><rect x="50" y="121" width="228" height="128" rx="5" fill="none" stroke="#a94f16" stroke-width="2" stroke-dasharray="6 4"/><text x="61" y="147" font-size="18" fill="#a94f16" font-weight="700" text-anchor="start">10</text><text x="330" y="137" font-size="19" fill="#283249" font-weight="400" text-anchor="start">10 is the cage total.</text><text x="330" y="166" font-size="19" fill="#283249" font-weight="400" text-anchor="start">1 + 9 = 10.</text><text x="330" y="195" font-size="19" fill="#283249" font-weight="400" text-anchor="start">The digits are different.</text><text x="44" y="315" font-size="19" fill="#283249" font-weight="400" text-anchor="start">Also check the row, column, and 3 × 3 box.</text><text x="44" y="344" font-size="19" fill="#283249" font-weight="400" text-anchor="start">Each must still contain digits 1 to 9 exactly once.</text></g></svg>
