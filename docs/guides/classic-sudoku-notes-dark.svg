<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>Notes are possibilities, not final answers</title><desc>Classic Sudoku · using pencil marks</desc><rect width="720" height="400" rx="20" fill="#1b2133"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="36" font-size="23" fill="#edf0fa" font-weight="700" text-anchor="start">Notes are possibilities, not final answers</text><text x="28" y="62" font-size="16" fill="#a4aec7" font-weight="400" text-anchor="start">Classic Sudoku · using pencil marks</text><rect x="40" y="108" width="120" height="120" rx="10" fill="#252d42" stroke="#48536b" stroke-width="2"/><text x="60" y="140" font-size="20" fill="#a4aec7" font-weight="400" text-anchor="start">1</text><text x="127" y="140" font-size="20" fill="#a4aec7" font-weight="400" text-anchor="start">3</text><text x="60" y="176" font-size="20" fill="#a4aec7" font-weight="400" text-anchor="start">4</text><text x="210" y="182" font-size="44" fill="#ffb783" font-weight="400" text-anchor="start">→</text><rect x="294" y="108" width="120" height="120" rx="7" fill="#382a24" stroke="#ffb783" stroke-width="2"/><text x="354.0" y="176.0" font-size="24" fill="#edf0fa" font-weight="700" text-anchor="middle">4</text><text x="40" y="269" font-size="20" fill="#ffb783" font-weight="700" text-anchor="start">Notes ON</text><text x="294" y="269" font-size="20" fill="#ffb783" font-weight="700" text-anchor="start">Notes OFF</text><text x="450" y="131" font-size="19" fill="#edf0fa" font-weight="400" text-anchor="start">Toggle Notes off</text><text x="450" y="160" font-size="19" fill="#edf0fa" font-weight="400" text-anchor="start">before entering</text><text x="450" y="189" font-size="19" fill="#edf0fa" font-weight="400" text-anchor="start">your final answer.</text><text x="40" y="324" font-size="18" fill="#edf0fa" font-weight="400" text-anchor="start">Tap a candidate again to remove its note.</text><text x="40" y="353" font-size="18" fill="#edf0fa" font-weight="400" text-anchor="start">A final entry removes matching notes from its row, column, and box.</text></g></svg>
