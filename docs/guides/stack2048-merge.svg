<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>Each tile can merge only once in a move</title><desc>Stack 2048 · one row sliding left, before a new tile spawns</desc><rect width="720" height="400" rx="20" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="36" font-size="23" fill="#283249" font-weight="700" text-anchor="start">Each tile can merge only once in a move</text><text x="28" y="62" font-size="16" fill="#536078" font-weight="400" text-anchor="start">Stack 2048 · one row sliding left, before a new tile spawns</text><text x="28" y="119" font-size="16" fill="#536078" font-weight="700" text-anchor="start">BEFORE</text><rect x="28" y="139" width="66" height="66" rx="7" fill="#eee4da" stroke="#c6cfdd" stroke-width="2"/><text x="61.0" y="180.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">2</text><rect x="104" y="139" width="66" height="66" rx="7" fill="#eee4da" stroke="#c6cfdd" stroke-width="2"/><text x="137.0" y="180.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">2</text><rect x="180" y="139" width="66" height="66" rx="7" fill="#eee4da" stroke="#c6cfdd" stroke-width="2"/><text x="213.0" y="180.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">2</text><rect x="256" y="139" width="66" height="66" rx="7" fill="#eee4da" stroke="#c6cfdd" stroke-width="2"/><text x="289.0" y="180.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">2</text><text x="349" y="182" font-size="34" fill="#a94f16" font-weight="400" text-anchor="start">→</text><text x="410" y="119" font-size="16" fill="#536078" font-weight="700" text-anchor="start">AFTER</text><rect x="410" y="139" width="62" height="62" rx="7" fill="#ede0c8" stroke="#c6cfdd" stroke-width="2"/><text x="441.0" y="178.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">4</text><rect x="482" y="139" width="62" height="62" rx="7" fill="#ede0c8" stroke="#c6cfdd" stroke-width="2"/><text x="513.0" y="178.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">4</text><rect x="554" y="139" width="62" height="62" rx="7" fill="#e9edf3" stroke="#c6cfdd" stroke-width="2"/><text x="585.0" y="178.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle"></text><rect x="626" y="139" width="62" height="62" rx="7" fill="#e9edf3" stroke="#c6cfdd" stroke-width="2"/><text x="657.0" y="178.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle"></text><text x="28" y="264" font-size="19" fill="#283249" font-weight="400" text-anchor="start">2 + 2 becomes 4, twice. This move earns 8 points.</text><text x="28" y="293" font-size="19" fill="#283249" font-weight="400" text-anchor="start">The two new 4s cannot merge again during this same move.</text><text x="28" y="322" font-size="19" fill="#283249" font-weight="400" text-anchor="start">After the move, one random 2 or 4 appears in an empty cell.</text></g></svg>
