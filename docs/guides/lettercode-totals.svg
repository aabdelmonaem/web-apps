<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>The clues are totals for the entire word</title><desc>LetterCode · teaching example with secret BRAIN</desc><rect width="720" height="400" rx="20" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="36" font-size="23" fill="#283249" font-weight="700" text-anchor="start">The clues are totals for the entire word</text><text x="28" y="62" font-size="16" fill="#536078" font-weight="400" text-anchor="start">LetterCode · teaching example with secret BRAIN</text><rect x="28" y="112" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="52.0" y="144.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">S</text><rect x="84" y="112" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="108.0" y="144.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">T</text><rect x="140" y="112" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="164.0" y="144.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">A</text><rect x="196" y="112" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="220.0" y="144.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">R</text><rect x="252" y="112" width="48" height="48" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="276.0" y="144.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">E</text><rect x="346" y="112" width="104" height="48" rx="10" fill="#e7f3ed" stroke="#17624c" stroke-width="2"/><text x="398" y="144" font-size="21" fill="#17624c" font-weight="700" text-anchor="middle">G 1</text><rect x="462" y="112" width="104" height="48" rx="10" fill="#fff3ce" stroke="#775a00" stroke-width="2"/><text x="514" y="144" font-size="21" fill="#775a00" font-weight="700" text-anchor="middle">Y 1</text><rect x="578" y="112" width="104" height="48" rx="10" fill="#fff0f1" stroke="#ac3445" stroke-width="2"/><text x="630" y="144" font-size="21" fill="#ac3445" font-weight="700" text-anchor="middle">R 3</text><text x="28" y="220" font-size="19" fill="#283249" font-weight="400" text-anchor="start">G 1: A is in the correct position.</text><text x="28" y="249" font-size="19" fill="#283249" font-weight="400" text-anchor="start">Y 1: R is in the word, in another position.</text><text x="28" y="278" font-size="19" fill="#283249" font-weight="400" text-anchor="start">R 3: S, T, and E do not match.</text><text x="28" y="346" font-size="18" fill="#a94f16" font-weight="700" text-anchor="start">The game reveals only the totals; it does not identify the matching letters.</text></g></svg>
