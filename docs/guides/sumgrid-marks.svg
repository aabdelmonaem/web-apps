<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>Keep the numbers you need; erase the others</title><desc>SumGrid · a row with target 3</desc><rect width="720" height="400" rx="20" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="36" font-size="23" fill="#283249" font-weight="700" text-anchor="start">Keep the numbers you need; erase the others</text><text x="28" y="62" font-size="16" fill="#536078" font-weight="400" text-anchor="start">SumGrid · a row with target 3</text><rect x="40" y="120" width="80" height="80" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="80.0" y="168.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">2</text><text x="80" y="238" font-size="19" fill="#a94f16" font-weight="700" text-anchor="middle">Keep</text><circle cx="80" cy="160" r="31" fill="none" stroke="#a94f16" stroke-width="2"/><rect x="140" y="120" width="80" height="80" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="180.0" y="168.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">4</text><text x="180" y="238" font-size="19" fill="#a94f16" font-weight="700" text-anchor="middle">Erase</text><rect x="240" y="120" width="80" height="80" rx="7" fill="white" stroke="#c6cfdd" stroke-width="2"/><text x="280.0" y="168.0" font-size="24" fill="#283249" font-weight="700" text-anchor="middle">1</text><text x="280" y="238" font-size="19" fill="#a94f16" font-weight="700" text-anchor="middle">Keep</text><circle cx="280" cy="160" r="31" fill="none" stroke="#a94f16" stroke-width="2"/><text x="390" y="139" font-size="19" fill="#283249" font-weight="400" text-anchor="start">2 + 1 reaches target 3.</text><text x="390" y="168" font-size="19" fill="#283249" font-weight="400" text-anchor="start">The 4 must not count.</text><text x="390" y="197" font-size="19" fill="#283249" font-weight="400" text-anchor="start">Erase hides that number.</text><text x="40" y="310" font-size="18" fill="#283249" font-weight="400" text-anchor="start">Choose Keep or Erase, then tap a cell.</text><text x="40" y="339" font-size="18" fill="#283249" font-weight="400" text-anchor="start">Tap it again with the same tool to return it to unmarked.</text><text x="40" y="368" font-size="18" fill="#283249" font-weight="400" text-anchor="start">On Hard and Expert, match the lettered region totals too.</text></g></svg>
