irection.</text><text x="330" y="154" font-size="18" fill="#283249" font-weight="400" text-anchor="start">Equal neighbors merge after gaps close.</text><text x="330" y="183" font-size="18" fill="#283249" font-weight="400" text-anchor="start">A move that changes nothing</text><text x="330" y="212" font-size="18" fill="#283249" font-weight="400" text-anchor="start">does not spawn a tile.</text><rect x="330" y="264" width="360" height="76" rx="10" fill="#fff0df" stroke="#e8c7a7" stroke-width="2"/><text x="346" y="293" font-size="17" fill="#283249" font-weight="400" text-anchor="start">Keep empty cells available.</text><text x="346" y="322" font-size="17" fill="#283249" font-weight="400" text-anchor="start">Undo can reverse a move, up to 3 times.</text></g></svg>
