<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>Select a blank, then choose a number</title><desc>CrossMath · placing a tile</desc><rect width="720" height="400" rx="20" fill="#1b2133"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="36" font-size="23" fill="#edf0fa" font-weight="700" text-anchor="start">Select a blank, then choose a number</text><text x="28" y="62" font-size="16" fill="#a4aec7" font-weight="400" text-anchor="start">CrossMath · placing a tile</text><rect x="40" y="99" width="52" height="52" rx="7" fill="#252d42" stroke="#48536b" stroke-width="2"/><text x="66.0" y="133.0" font-size="24" fill="#edf0fa" font-weight="700" text-anchor="middle">3</text><rect x="98" y="99" width="52" height="52" rx="7" fill="#252d42" stroke="#48536b" stroke-width="2"/><text x="124.0" y="133.0" font-size="24" fill="#edf0fa" font-weight="700" text-anchor="middle">+</text><rect x="156" y="99" width="52" height="52" rx="7" fill="#382a24" stroke="#ffb783" stroke-width="2"/><text x="182.0" y="133.0" font-size="24" fill="#edf0fa" font-weight="700" text-anchor="middle">?</text><rect x="214" y="99" width="52" height="52" rx="7" fill="#252d42" stroke="#48536b" stroke-width="2"/><text x="240.0" y="133.0" font-size="24" fill="#edf0fa" font-weight="700" text-anchor="middle">=</text><rect x="272" y="99" width="52" height="52" rx="7" fill="#252d42" stroke="#48536b" stroke-width="2"/><text x="298.0" y="133.0" font-size="24" fill="#edf0fa" font-weight="700" text-anchor="middle">8</text><text x="40" y="201" font-size="16" fill="#a4aec7" font-weight="700" text-anchor="start">YOUR NUMBERS</text><rect x="40" y="220" width="62" height="62" rx="7" fill="#382a24" stroke="#ffb783" stroke-width="2"/><text x="71.0" y="259.0" font-size="24" fill="#edf0fa" font-weight="700" text-anchor="middle">5</text><path d="M105 248 Q185 248 185 172" fill="none" stroke="#ffb783" stroke-width="3"/><path d="m178 181 7-12 7 12" fill="none" stroke="#ffb783" stroke-width="3"/><text x="390" y="118" font-size="19" fill="#edf0fa" font-weight="400" text-anchor="start">Tap the blank first.</text><text x="390" y="147" font-size="19" fill="#edf0fa" font-weight="400" text-anchor="start">Tap 5 in Your Numbers.</text><text x="390" y="176" font-size="19" fill="#edf0fa" font-weight="400" text-anchor="start">Or drag 5 onto the blank.</text><text x="40" y="335" font-size="18" fill="#edf0fa" font-weight="400" text-anchor="start">Tap a placed tile to return it to the bank.</text><text x="40" y="364" font-size="18" fill="#edf0fa" font-weight="400" text-anchor="start">A wrong number stays in the bank and costs a heart in standard play.</text></g></svg>
