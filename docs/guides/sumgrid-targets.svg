ont-weight="400" text-anchor="start">Empty cells contribute 0.</text><text x="355" y="315" font-size="18" fill="#283249" font-weight="400" text-anchor="start">All row and column targets</text><text x="355" y="344" font-size="18" fill="#283249" font-weight="400" text-anchor="start">are matched in this example.</text></g></svg>
